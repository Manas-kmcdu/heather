ormal; }\na { color: #b9a6c9; }\na:hover { color: #ede8e0; }\n\n.page { position: relative; isolation: isolate; background: #0a0a0b; color: #ede8e0; font-family: 'Newsreader', Georgia, 'Times New Roman', serif; font-size: 19px; line-height: 1.5; overflow: hidden; }\n.page::before { content: \"\"; position: absolute; inset: 0; z-index: -1; pointer-events: none;\n  background:\n    repeating-linear-gradient(90deg, rgba(237,232,224,0.028) 0 2px, transparent 2px 7px),\n    repeating-linear-gradient(0deg, rgba(0,0,0,0.5) 0 1px, transparent 1px 6px); }\n.wrap { width: 100%; max-width: 1240px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }\n\n.mono { font: 500 13px/1.4 'DM Mono', ui-monospace, Menlo, monospace; letter-spacing: 0.18em; text-transform: uppercase; color: #9d978e; }\n.hd { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding-top: 22px; padding-bottom: 18px; position: relative; z-index: 3; }\n.hd nav { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }\n.mini { font: 500 13px/1 'DM Mono', ui-monospace, Menlo, monospace; letter-spacing: 0.16em; text-transform: uppercase; text-decoration: none; color: #ede8e0; border: 1px solid #ede8e0; padding: 13px 16px; border-radius: 2px; min-height: 44px; display: inline-flex; align-items: center; }\n.mini:hover { background: #ede8e0; color: #0a0a0b; }\n\n/* conveyor */\n.rail { position: relative; height: 330px; overflow: hidden; margin-top: -8px;\n  -webkit-mask-image: linear-gradient(#000 0, #000 62%, transparent 100%); mask-image: linear-gradient(#000 0, #000 62%, transparent 100%); }\n.rail::before { content: \"\"; position: absolute; left: 0; right: 0; top: 18px; height: 8px; z-index: 2;\n  background:\n    repeating-linear-gradient(90deg, #4a4a50 0 2px, transparent 2px 16px),\n    linear-gradient(#3a3a40, #3a3a40);\n  background-size: 100% 8px, 100% 2px; backgrou Your college\" value=\"{{college}}\" sc-camel-on-change=\"{{setCollege}}\">\n          <\u002Fdiv>\n          <div class=\"field\">\n            <label for=\"f-year\">Year<\u002Flabel>\n            <sc-raw-select id=\"f-year\" name=\"year\" value=\"{{year}}\" sc-camel-on-change=\"{{setYear}}\">\n              <option value=\"\">Select your year<\u002Foption>\n              <option value=\"1st year\">1st year<\u002Foption>\n              <option value=\"2nd year\">2nd year<\u002Foption>\n              <option value=\"3rd year\">3rd year<\u002Foption>\n              <option value=\"4th year\">4th year<\u002Foption>\n              <option value=\"5th year\">5th year<\u002Foption>\n              <option value=\"Postgraduate\">Postgraduate<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-for list=\"{{questions}}\" as=\"q\" hint-placeholder-count=\"4\">\n          <fieldset class=\"q\">\n            <legend><span class=\"mono\">{{q.label}}<\u002Fspan><span class=\"qt\">{{q.text}}<\u002Fspan><\u002Flegend>\n            <div class=\"opts\">\n              <sc-for list=\"{{q.options}}\" as=\"opt\" hint-placeholder-count=\"4\">\n                <label class=\"opt\"><input type=\"radio\" id=\"{{opt.domId}}\" name=\"{{opt.name}}\" checked=\"{{opt.checked}}\" sc-camel-on-change=\"{{opt.pick}}\"><span class=\"mk\"><\u002Fspan><span>{{opt.text}}<\u002Fspan><\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Ffieldset>\n        <\u002Fsc-for>\n\n        <sc-if value=\"{{hasError}}\" hint-placeholder-val=\"{{ false }}\"><p class=\"err\" role=\"alert\">{{error}}<\u002Fp><\u002Fsc-if>\n        <div class=\"submitRow\">\n          <button class=\"cta\" type=\"submit\">Request my spot\n            <svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"square\" aria-hidden=\"true\"><path d=\"M4 12h16M14 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n          <span class=\"spots\"><span class=\"led\"><\u002Fspan>Limited spots<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fform>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{submitted}}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"done\" role=\"status\">\n        <span class=\"mono\">Heather Day / 3 December 2026<\u002Fspan>\n        <h3>Request noted, {{firstName}}.<\u002Fh3>\n        <p>Spots are limited. Your answers will be used to curate your dates.<\u002Fp>\n        <button class=\"cta ghost\" type=\"button\" sc-camel-on-click=\"{{edit}}\">Edit my answers<\u002Fbutton>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"wrap\">\n    <footer class=\"ft\">\n      <p>Heather Day is organised by Unrest, the verified network for Delhi University students.<\u002Fp>\n      <span class=\"mono\">Delhi University students only<\u002Fspan>\n    <\u002Ffooter>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:3500}}\">\nconst QUESTIONS = [\n  { id: \"interesting\", text: \"What makes someone instantly interesting to you?\", opts: [\"Their sense of humour.\", \"The way they think.\", \"Their taste in music, films and books.\", \"How they make others feel.\"] },\n  { id: \"conversation\", text: \"Pick your ideal first conversation.\", opts: [\"Childhood memories and nostalgia.\", \"Films, music and literature.\", \"Ambitions, dreams and life.\", \"Absolutely random conversations.\"] },\n  { id: \"nervous\", text: \"Someone you're meeting seems nervous. You...\", opts: [\"Take the lead and break the ice.\", \"Give them time to open up.\", \"Find something you both enjoy.\", \"Let things happen naturally.\"] },\n  { id: \"why\", text: \"What brings you to Heather Day?\", opts: [\"Meeting someone beyond my usual circles.\", \"Curiosity about the concept.\", \"The possibility of a meaningful connection.\", \"I'm here for the experience.\"] }\n];\nconst TICKS = [\"5 minutes\", \"One stranger\", \"Delhi University only\", \"Limited spots\", \"3 December 2026\"];\nconst TARGET = Date.parse(\"2026-12-03T00:00:00+05:30\");\n// Paste your Google Apps Script web app URL (ends in /exec) between the quotes.\nconst SCRIPT_URL = \"\";\n\nclass Component extends DCLogic {\n  state = { now: Date.now(), name: \"\", college: \"\", year: \"\", answers: {}, submitted: false, sending: false, error: \"\" };\n\n  componentDidMount() {\n    this._timer = setInterval(() => this.setState({ now: Date.now() }), 30000);\n  }\n  componentWillUnmount() {\n    clearInterval(this._timer);\n  }\n\n  renderVals() {\n    const s = this.state;\n    const ms = Math.max(0, TARGET - s.now);\n    const pad = (n) => String(n).padStart(2, \"0\");\n    const d = pad(Math.floor(ms / 864e5));\n    const h = pad(Math.floor((ms % 864e5) / 36e5));\n    const m = pad(Math.floor((ms % 36e5) / 6e4));\n\n    const questions = QUESTIONS.map((q, qi) => ({\n      label: \"Question \" + (qi + 1) + \" of \" + QUESTIONS.length,\n      text: q.text,\n      options: q.opts.map((t, oi) => ({\n        text: t,\n        name: q.id,\n        domId: q.id + \"-\" + oi,\n        checked: s.answers[q.id] === t,\n        pick: () => this.setState((p) => ({ answers: Object.assign({}, p.answers, { [q.id]: t }), error: \"\" }))\n      }))\n    }));\n\n    const ticks = [];\n    for (let i = 0; i < 2; i++) TICKS.forEach((t) => ticks.push({ text: t }));\n\n    return {\n      sweaters: Array.from({ length: 12 }, (_, i) => ({ i })),\n      ticks,\n      d1: d[0], d2: d[1], h1: h[0], h2: h[1], m1: m[0], m2: m[1],\n      questions,\n      name: s.name, college: s.college, year: s.year,\n      setName: (e) => this.setState({ name: e.target.value }),\n      setCollege: (e) => this.setState({ college: e.target.value }),\n      setYear: (e) => this.setState({ year: e.target.value }),\n      showForm: !s.submitted,\n      submitted: s.submitted,\n      hasError: !!s.error,\n      error: s.error,\n      firstName: (s.name.trim().split(\" \")[0]) || \"see you there\",\n      edit: () => this.setState({ submitted: false }),\n      submit: (e) => {\n        if (e && e.preventDefault) e.preventDefault();\n        const st = this.state;\n        const missing = !st.name.trim() || !st.college.trim() || !st.year || QUESTIONS.some((q) => !st.answers[q.id]);\n        if (missing) {\n          this.setState({ error: \"Please add your name, college and year, and answer all four questions.\" });\n          return;\n        }\n        if (!SCRIPT_URL) {\n          this.setState({ submitted: true, error: \"\" });\n          return;\n        }\n        if (st.sending) return;\n        this.setState({ sending: true, error: \"\" });\n        const payload = { name: st.name.trim(), college: st.college.trim(), year: st.year };\n        QUESTIONS.forEach((q) => { payload[q.id] = st.answers[q.id]; });\n        fetch(SCRIPT_URL, { method: \"POST\", mode: \"no-cors\", headers: { \"Content-Type\": \"text/plain;charset=utf-8\" }, body: JSON.stringify(payload) })\n          .then(() => this.setState({ submitted: true, sending: false }))\n          .catch(() => this.setState({ sending: false, error: \"Could not send your request. Check your connection and try again.\" }));\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
